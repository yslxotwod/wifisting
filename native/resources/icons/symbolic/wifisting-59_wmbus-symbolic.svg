<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500pt" height="500pt"
 viewBox="0 0 500 500" preserveAspectRatio="xMidYMid meet">
<!-- Wireless M-Bus: a utility meter face. The ring is the meter body,
     the needle is the dial, and the three ticks are the scale. Drawn as
     filled paths so the theme can recolour it via currentColor. -->
<g fill="#ff2147" stroke="none">

  <!-- Meter body: a ring, outer radius 190, inner 148. Even-odd so the
       inner circle punches the hole. -->
  <path fill-rule="evenodd" d="
    M 250 60
    a 190 190 0 1 0 0.1 0 z
    M 250 102
    a 148 148 0 1 1 -0.1 0 z"/>

  <!-- Scale ticks, at 225, 270 and 315 degrees on the dial. -->
  <rect x="238" y="112" width="24" height="46" rx="6"
        transform="rotate(-45 250 250)"/>
  <rect x="238" y="112" width="24" height="46" rx="6"
        transform="rotate(-90 250 250)"/>
  <rect x="238" y="112" width="24" height="46" rx="6"
        transform="rotate(-135 250 250)"/>

  <!-- Needle: a tapered blade from the centre out to the upper right,
       with a counterweight tail so it reads as a dial rather than an
       arrow. -->
  <path d="
    M 250 250
    L 372 138
    L 388 154
    L 262 258 z"/>
  <path d="
    M 250 250
    L 176 316
    L 188 330
    L 258 262 z"/>

  <!-- Hub. -->
  <circle cx="250" cy="250" r="30"/>

  <!-- Radio arc, top right and outside the body: this one is read over
       the air. Two arcs, no third, so it does not read as a Wi-Fi fan. -->
  <path fill-rule="evenodd" d="
    M 396 96
    a 120 120 0 0 1 44 52
    l -30 12
    a 88 88 0 0 0 -32 -38 z"/>
  <path fill-rule="evenodd" d="
    M 430 62
    a 180 180 0 0 1 56 78
    l -30 12
    a 148 148 0 0 0 -46 -64 z"/>
</g>
</svg>
